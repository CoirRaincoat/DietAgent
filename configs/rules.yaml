# Numeric weights are engineering preferences, not evidence-based clinical doses.
# Labels such as 降糖/降压/抗癌 in raw data never constitute evidence.
health_goals:
  控糖:
    sources: [who_healthy_diet]
    prefer_categories: [vegetable]
    prefer_terms: [糙米, 燕麦, 藜麦, 全麦]
    discourage_terms: [白糖, 白砂糖, 砂糖, 冰糖, 红糖, 蜂蜜, 糖浆, 炼乳, 炼奶]
    note: "控糖偏好仅结合食材种类排序；缺少份量和成分数据，不能判断低糖或个人血糖反应。"
  增肌:
    sources: [who_healthy_diet]
    prefer_categories: [protein]
    prefer_terms: [鸡蛋, 鸡肉, 鸡胸肉, 豆腐, 牛奶, 鱼]
    discourage_terms: []
    note: "增肌偏好优先提供蛋白质来源；未计算蛋白质克数或增肌效果。"
  减脂:
    sources: [who_healthy_diet]
    prefer_categories: [vegetable]
    prefer_methods: [蒸, 煮, 炖, 焯]
    discourage_methods: [炸, 油炸, 油煎]
    discourage_terms: [白糖, 砂糖, 冰糖, 糖浆, 猪油, 黄油, 奶油]
    note: "减脂偏好结合食材和做法排序；热量及份量未知，不承诺减重或低热量。"
  降尿酸:
    sources: [niams_gout]
    prefer_categories: [vegetable]
    discourage_terms: [猪肝, 鸡肝, 鸭肝, 鹅肝, 牛肝, 肝脏, 猪腰, 猪肾, 牛肾, 猪心, 猪肚, 沙丁鱼, 凤尾鱼, 虾, 蟹, 啤酒, 白酒, 黄酒, 糖浆]
    note: "降尿酸偏好降低部分内脏、海鲜和酒类配方的排序；没有嘌呤数值，不保证降低尿酸。"
  降压:
    sources: [who_healthy_diet]
    prefer_categories: [vegetable]
    discourage_terms: [酱油, 生抽, 老抽, 蚝油, 豆瓣酱, 豆豉, 咸菜, 腌菜, 腊肉, 火腿, 培根, 香肠]
    note: "降压偏好关注含盐调味品来源；用量未知，不能判定低钠或治疗效果。"
