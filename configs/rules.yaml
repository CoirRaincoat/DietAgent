version: "mvp-1"
scope: "基于菜谱文字的过敏与明确禁忌筛查；健康目标仅为定性排序，不计算营养摄入或治疗效果。"
sources:
  who_healthy_diet:
    title: "WHO Healthy diet"
    url: "https://www.who.int/news-room/fact-sheets/detail/healthy-diet"
    checked_on: "2026-09-24"
    use: "多样食物、蛋白质来源、蔬菜及减少游离糖/钠的一般原则；不把人群阈值当个体目标。"
  fda_allergens:
    title: "FDA Food Allergies"
    url: "https://www.fda.gov/food/nutrition-food-labeling-and-critical-foods/food-allergies"
    checked_on: "2026-09-24"
    use: "常见过敏原分类依据；中文词表为本项目保守工程映射，不代表完整医学或产品标签审核。"
  niams_gout:
    title: "NIAMS Gout: Diagnosis, Treatment, and Steps to Take"
    url: "https://www.niams.nih.gov/health-topics/gout/diagnosis-treatment-and-steps-to-take"
    checked_on: "2026-09-24"
    use: "将内脏、部分海鲜、酒及含糖饮料作为降尿酸偏好的排序提示，不诊断、不保证尿酸下降。"

